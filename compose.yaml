# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  # --- Backend .NET ---
  server:
    # build:
    #   context: .
    #   dockerfile: src/Dockerfile
    #   target: final
    image: tritonviet/dacnbe:v1
    pull_policy: never
    container_name: vietedu-api
    restart: always
    ports:
      - "5223:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:8080
    depends_on:
      - redis-service
    volumes:
      - ./shared-uploads:/app/wwwroot/uploads
      - ./lucene_data:/app/lucene_data

  # --- Redis (Caching & Hangfire) ---
  redis-service:
    image: redis:alpine
    container_name: redis-cache
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data

    # --- Cloudflare Tunnel ---
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: always
    command: tunnel run --token ${TUNNEL_TOKEN}
    # Không cần expose port, tunnel kết nối outbound đến Cloudflare
    # Truy cập server qua Docker internal network: http://server:8080

volumes:
  redis-data:

