# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  # --- Backend .NET ---
  server:
    build:
      context: .
      dockerfile: src/VietEdu.Api/Dockerfile
      target: final
    container_name: vietedu-api
    restart: always
    ports:
      - "5223:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${POSTGRES_CONNECTION}
      - ConnectionStrings__Redis=${REDIS_CONNECTION}
      - Cloudinary__Url=${CLOUDINARY_URL}
      - Gemini__ApiKey=${GEMINI_API_KEY}
      - AI__ServerUrl=${AI_SERVER_URL}
    depends_on:
      - redis-service
    volumes:
      - ./shared-uploads:/app/wwwroot/uploads

  # --- Redis (Caching & Hangfire) ---
  redis-service:
    image: redis:alpine
    container_name: redis-cache
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data

volumes:
  redis-data:

